[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "teamzero"
version = "0.1.0-alpha.3"
description = "Autonomous Agentic AI Software Organization Architecture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "mcp>=1.0.0",
    "pytest>=7.4.0",
]

[project.scripts]
tz = "teamzero.cli:main"
teamzero = "teamzero.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["teamzero*"]
